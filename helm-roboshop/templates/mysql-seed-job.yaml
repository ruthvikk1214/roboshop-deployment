apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-db-seed
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      name: mysql-db-seed
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 mysql 3306; do echo waiting for mysql; sleep 3; done;']
      containers:
      - name: db-seed
        image: mysql:5.7
        command:
        - /bin/bash
        - -c
        - |
          echo "Applying user permissions and schema..."
          mysql -h mysql -uroot -p'RoboShop@1' < /scripts/app-user.sql

          echo "Checking if master data exists..."
          COUNT=$(mysql -h mysql -uroot -p'RoboShop@1' -sN -e "SELECT count(*) FROM cities.cities;" 2>/dev/null || echo 0)

          if [ "$COUNT" -eq "0" ]; then
            echo "Loading master-data.sql into cities database..."
            mysql -h mysql -uroot -p'RoboShop@1' cities < /scripts/master-data.sql
            echo "Database seeded successfully."
          else
            echo "Master data already loaded (Count: $COUNT). Skipping."
          fi
        volumeMounts:
        - name: init-scripts
          mountPath: /scripts
      volumes:
      - name: init-scripts
        configMap:
          name: mysql-init-scripts