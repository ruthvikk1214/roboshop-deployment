apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-db-seed
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 3
  template:
    metadata:
      name: mysql-db-seed
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-seed
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.mysql.image.repository }}:{{ default .Values.global.imageTag .Values.mysql.image.tag }}"
        env:
        - name: MYSQL_PWD
          value: {{ .Values.mysql.env.MYSQL_ROOT_PASSWORD | quote }}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        command:
        - /bin/bash
        - -ec
        - |
          echo "=== MySQL DB Seed Job Started ==="
          echo "Waiting for MySQL to accept authenticated queries..."
          echo "(MySQL runs init scripts on first boot — this can take 10-20 min)"
          RETRIES=0
          MAX_RETRIES=180
          until mysql --protocol=tcp -h mysql -uroot -e "SELECT 1" >/dev/null 2>&1; do
            RETRIES=$((RETRIES + 1))
            if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
              echo "ERROR: MySQL did not become ready after $MAX_RETRIES attempts (15 min). Exiting."
              echo "--- Debugging: attempting direct connection to get error ---"
              mysql --protocol=tcp -h mysql -uroot -e "SELECT 1" 2>&1 || true
              exit 1
            fi
            if [ $((RETRIES % 12)) -eq 0 ]; then
              echo "  Minute $((RETRIES / 12)) — MySQL not ready yet, still waiting..."
            fi
            sleep 5
          done

          echo "MySQL is ready! Applying user permissions and schema..."
          mysql --protocol=tcp -h mysql -uroot < /docker-entrypoint-initdb.d/app-user.sql

          echo "Checking if master data exists..."
          COUNT=$(mysql --protocol=tcp -h mysql -uroot -sN -e "SELECT count(*) FROM cities.cities;" 2>/dev/null || echo 0)

          if [ "$COUNT" -eq "0" ]; then
            if [ ! -s /docker-entrypoint-initdb.d/master-data.sql ]; then
              echo "Master data is missing and the MySQL image does not contain master-data.sql." >&2
              exit 1
            fi
            echo "Loading master-data.sql into cities database..."
            mysql --protocol=tcp -h mysql -uroot cities < /docker-entrypoint-initdb.d/master-data.sql
            echo "Database seeded successfully."
          else
            echo "Master data already loaded (Count: $COUNT). Skipping."
          fi
          echo "=== MySQL DB Seed Job Completed Successfully ==="
