apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-db-seed
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 5
  template:
    metadata:
      name: mysql-db-seed
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-seed
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.mysql.image.repository }}:{{ default .Values.global.imageTag .Values.mysql.image.tag }}"
        env:
        - name: MYSQL_PWD
          value: {{ .Values.mysql.env.MYSQL_ROOT_PASSWORD | quote }}
        command:
        - /bin/bash
        - -ec
        - |
          echo "Waiting for MySQL to accept authenticated queries..."
          until mysql --protocol=tcp -h mysql -uroot -e "SELECT 1" >/dev/null 2>&1; do
            sleep 5
          done

          echo "Applying user permissions and schema..."
          mysql --protocol=tcp -h mysql -uroot < /docker-entrypoint-initdb.d/app-user.sql

          echo "Checking if master data exists..."
          COUNT=$(mysql --protocol=tcp -h mysql -uroot -sN -e "SELECT count(*) FROM cities.cities;" 2>/dev/null || echo 0)

          if [ "$COUNT" -eq "0" ]; then
            if [ ! -s /docker-entrypoint-initdb.d/master-data.sql ]; then
              echo "Master data is missing and the MySQL image does not contain master-data.sql." >&2
              exit 1
            fi
            echo "Loading master-data.sql into cities database..."
            mysql --protocol=tcp -h mysql -uroot cities < /docker-entrypoint-initdb.d/master-data.sql
            echo "Database seeded successfully."
          else
            echo "Master data already loaded (Count: $COUNT). Skipping."
          fi