# helm-roboshop/elk-values.yaml
# Lightweight ELK configuration tuned for 2-node educational EKS clusters

elasticsearch:
  replicas: 1
  minimumMasterNodes: 1
  esJavaOpts: "-Xmx512m -Xms512m"
  resources:
    requests:
      cpu: 100m
      memory: 700Mi
    limits:
      cpu: 500m
      memory: 1.2Gi
  persistence:
    enabled: false  # Uses emptyDir to avoid EBS PVC attachment delays

kibana:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

filebeat:
  daemonset:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi