name: Destroy Infrastructure

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  destroy:
    name: Destroy EKS & AWS Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --name roboshop-eks --region ${{ env.AWS_REGION }} || echo "Cluster already unreachable"

      - name: Destroy Route53 Records
        run: |
          cd infra/route53
          terraform init
          terraform destroy -auto-approve || echo "Route53 records already removed"

      - name: Uninstall Roboshop & Teardown ALB
        run: |
          echo "Uninstalling Roboshop Helm release (triggers ALB deletion)..."
          helm uninstall roboshop -n roboshop || kubectl delete ingress roboshop-ingress -n roboshop --ignore-not-found=true

          echo "Waiting for AWS ALB 'roboshop-alb' to be completely deleted..."
          while true; do
            ALB_EXISTS=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} 2>&1 || true)
            if echo "$ALB_EXISTS" | grep -q "LoadBalancerNotFound"; then
              echo "ALB successfully deleted from AWS."
              break
            fi
            echo "Waiting for ALB deletion in AWS..."
            sleep 10
          done

      - name: Uninstall Monitoring Stack & PVCs
        run: |
          helm uninstall monitoring-stack -n monitoring || true
          kubectl delete pvc --all -n monitoring --ignore-not-found=true
          kubectl delete pvc --all -n roboshop --ignore-not-found=true

      - name: Uninstall AWS Load Balancer Controller
        run: |
          helm uninstall aws-load-balancer-controller -n kube-system || true

      - name: Terraform Destroy (EKS, VPC, IAM)
        run: |
          cd infra
          terraform init
          terraform destroy -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" -auto-approve