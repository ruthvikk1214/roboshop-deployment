name: Roboshop CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # Manual gate trigger

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # 1. Vulnerability Scanning
  image-scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Add Maven cache to avoid rate limiting
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Populate Maven cache before Trivy scan
      - name: Resolve Maven dependencies
        run: |
          find . -name "pom.xml" -type f | while read pom; do
            mvn -f "$pom" dependency:resolve -DskipTests || true
          done
        continue-on-error: true

      # Suggestion: Using 'fs' (file system) scan is much faster than building 6 docker images
      # on every push. It scans the Dockerfiles and package.json/requirements.txt directly.
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 2. Infrastructure Security Scanning
  terraform-checkov:
    name: Terraform Security (Checkov)
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          soft_fail: true # Set to false if you want Checkov to break the build on failure

  # 3. Terraform Plan & Validation
  terraform-plan:
    name: Terraform Plan & Validate
    runs-on: ubuntu-latest
    needs: terraform-checkov
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"
        working-directory: infra

  # 4. Terraform Apply (Manual Gate)
  terraform-apply:
    name: Terraform Apply (Manual Gate)
    runs-on: ubuntu-latest
    needs: terraform-plan
    # This ensures the apply job ONLY runs when you manually trigger it via the Actions UI
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" -auto-approve
        working-directory: infra

      - name: Install AWS Load Balancer Controller
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          VPC_ID=$(terraform output -raw vpc_id)
          ALB_ROLE_ARN=$(terraform output -raw alb_controller_role_arn)

          aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ env.AWS_REGION }}

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --create-namespace \
            --set clusterName=$CLUSTER_NAME \
            --set serviceAccount.create=true \
            --set serviceAccount.name=alb-controller-sa \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ALB_ROLE_ARN" \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=$VPC_ID \
            --set defaultIngressClass=true
        working-directory: infra

      - name: Wait for ALB Controller to be ready
        run: |
          echo "Waiting for ALB Controller webhook to become available..."
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=120s
          sleep 15

      - name: Deploy Roboshop Helm Chart
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          ALB_SG_ID=$(terraform output -raw alb_sg_id)
          aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ env.AWS_REGION }}
          
          helm upgrade --install roboshop ../helm-roboshop \
            --namespace roboshop --create-namespace \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=roboshop.rk1214.in \
            --set "ingress.annotations.alb\.ingress\.kubernetes\.io/security-groups=$ALB_SG_ID"
        working-directory: infra

      - name: Configure Route53 DNS
        env:
          TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
        run: |
          echo "Waiting for ALB 'roboshop-alb' to be provisioned..."
          sleep 15
          until aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} >/dev/null 2>&1; do
            echo "Still waiting for ALB..."
            sleep 10
          done
          aws elbv2 wait load-balancer-available --names roboshop-alb --region ${{ env.AWS_REGION }}

          export TF_VAR_alb_dns_name=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} --query 'LoadBalancers[0].DNSName' --output text)
          export TF_VAR_alb_zone_id=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} --query 'LoadBalancers[0].CanonicalHostedZoneId' --output text)

          echo "ALB DNS : $TF_VAR_alb_dns_name"
          echo "ALB Zone: $TF_VAR_alb_zone_id"
          echo "Hosted Zone ID is set: $([ -n \"$TF_VAR_hosted_zone_id\" ] && echo YES || echo NO)"

          terraform init
          terraform apply -auto-approve
        working-directory: infra/route53
