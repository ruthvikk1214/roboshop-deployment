name: Roboshop CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  validate-and-plan:
    name: Terraform Plan & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"
        working-directory: infra

  deploy:
    name: Terraform Apply (Manual Gate)
    needs: validate-and-plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" -auto-approve
        working-directory: infra

      - name: Configure kubeconfig
        run: aws eks update-kubeconfig --name roboshop-eks --region ${{ env.AWS_REGION }}

      - name: Deploy Prometheus & Grafana Monitoring Stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community

          helm upgrade --install monitoring-stack prometheus-community/kube-prometheus-stack \
            -n monitoring \
            --create-namespace \
            -f monitoring-values.yaml

      - name: Install AWS Load Balancer Controller
        run: |
          ALB_ROLE_ARN=$(cd infra && terraform output -raw alb_controller_role_arn)

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=roboshop-eks \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$ALB_ROLE_ARN"

      - name: Wait for ALB Controller to be ready
        run: |
          kubectl rollout status deployment aws-load-balancer-controller -n kube-system --timeout=120s

      - name: Deploy Roboshop Helm Chart
        run: |
          helm upgrade --install roboshop ./helm-roboshop \
            -n roboshop \
            --create-namespace

      - name: Configure Route53 DNS
        run: |
          echo "Waiting for ALB 'roboshop-alb' to be provisioned in AWS..."
          while true; do
            ALB_DNS=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} \
              --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
            ALB_ZONE=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} \
              --query 'LoadBalancers[0].CanonicalHostedZoneId' --output text 2>/dev/null || echo "")

            if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ] && [ -n "$ALB_ZONE" ] && [ "$ALB_ZONE" != "None" ]; then
              echo "ALB found: $ALB_DNS (Zone: $ALB_ZONE)"
              break
            fi

            echo "Still waiting for ALB..."
            sleep 10
          done

          cd infra/route53
          terraform init
          terraform apply \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" \
            -var="alb_dns_name=$ALB_DNS" \
            -var="alb_zone_id=$ALB_ZONE" \
            -auto-approve