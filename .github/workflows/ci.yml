name: Roboshop CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # 1. SonarQube SAST & Quality Gate
  sast-scan:
    name: SonarQube SAST & Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          args: >
            -Dsonar.projectKey=ruthvikk1214_roboshop-deployment
            -Dsonar.organization=ruthvikk1214
            -Dsonar.sources=docker/
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/node_modules/**,**/vendor/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 2. Vulnerability Scanning (Trivy)
  image-scan:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Resolve Maven dependencies
        run: |
          find . -name "pom.xml" -type f | while read pom; do
            mvn -f "$pom" dependency:resolve -DskipTests || true
          done
        continue-on-error: true

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 3. Infrastructure Security Scanning (Checkov)
  terraform-checkov:
    name: Terraform Security (Checkov)
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          framework: terraform
          soft_fail: true

  # 4. Terraform Plan & Validation
  terraform-plan:
    name: Terraform Plan & Validate
    runs-on: ubuntu-latest
    needs: terraform-checkov
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: infra

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra

      - name: Terraform Plan
        run: terraform plan -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}"
        working-directory: infra

  # 5. Terraform Apply (Manual Approval Gate)
  terraform-apply:
    name: Terraform Apply (Manual Gate)
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: roboshop-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" -auto-approve
        working-directory: infra
      
      - name: Deploy Prometheus & Grafana Monitoring Stack
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ env.AWS_REGION }}

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          if helm list --namespace monitoring --filter '^monitoring-stack$' --short | grep -qx monitoring-stack; then
            RELEASE_STATUS=$(helm status monitoring-stack --namespace monitoring --output json | jq -r '.info.status')
            case "$RELEASE_STATUS" in
              pending-install|pending-upgrade|pending-rollback)
                echo "Monitoring release is stuck in $RELEASE_STATUS; restoring the last deployed revision."
                DEPLOYED_REVISION=$(helm history monitoring-stack --namespace monitoring --output json \
                  | jq -r '[.[] | select(.status == "deployed")] | last | .revision // empty')
                if [ -z "$DEPLOYED_REVISION" ]; then
                  echo "No deployed monitoring revision is available for automatic recovery."
                  helm history monitoring-stack --namespace monitoring
                  exit 1
                fi
                helm rollback monitoring-stack "$DEPLOYED_REVISION" \
                  --namespace monitoring --wait --timeout 15m
                ;;
            esac
          fi

          if ! helm upgrade --install monitoring-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --atomic \
            --wait \
            --timeout 15m \
            -f ../helm-roboshop/monitoring-values.yaml; then
            echo "Prometheus/Grafana deployment failed; collecting Kubernetes diagnostics."
            kubectl describe job monitoring-stack-kube-prom-admission-create -n monitoring || true
            kubectl get pods -n monitoring -o wide || true
            kubectl get events -n monitoring --sort-by=.lastTimestamp | tail -n 40 || true
            JOB_POD=$(kubectl get pods -n monitoring \
              -l job-name=monitoring-stack-kube-prom-admission-create \
              -o name | head -n 1)
            if [ -n "$JOB_POD" ]; then
              kubectl describe -n monitoring "$JOB_POD" || true
              kubectl logs -n monitoring "$JOB_POD" --all-containers=true || true
            fi
            exit 1
          fi
        working-directory: infra

      - name: Install AWS Load Balancer Controller
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          VPC_ID=$(terraform output -raw vpc_id)
          ALB_ROLE_ARN=$(terraform output -raw alb_controller_role_arn)

          aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ env.AWS_REGION }}

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --create-namespace \
            --set clusterName=$CLUSTER_NAME \
            --set serviceAccount.create=true \
            --set serviceAccount.name=alb-controller-sa \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$ALB_ROLE_ARN" \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=$VPC_ID \
            --set keepTLSSecret=true \
            --set defaultIngressClass=true
        working-directory: infra

      - name: Wait for ALB Controller to be ready
        run: |
          echo "Waiting for ALB Controller webhook to become available..."
          kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=5m
          sleep 15

      - name: Deploy Roboshop Helm Chart
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          ALB_SG_ID=$(terraform output -raw alb_sg_id)
          aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ env.AWS_REGION }}

          # Recover from a release left in a pending state by an aborted run.
          # Without this the upgrade fails with "another operation is in progress".
          if helm list --namespace roboshop --filter '^roboshop$' --short | grep -qx roboshop; then
            RELEASE_STATUS=$(helm status roboshop --namespace roboshop --output json | jq -r '.info.status')
            case "$RELEASE_STATUS" in
              pending-install|pending-upgrade|pending-rollback)
                echo "Roboshop release is stuck in $RELEASE_STATUS; restoring the last deployed revision."
                DEPLOYED_REVISION=$(helm history roboshop --namespace roboshop --output json \
                  | jq -r '[.[] | select(.status == "deployed")] | last | .revision // empty')
                if [ -z "$DEPLOYED_REVISION" ]; then
                  echo "No deployed roboshop revision is available; removing the stuck release."
                  helm uninstall roboshop --namespace roboshop
                else
                  helm rollback roboshop "$DEPLOYED_REVISION" \
                    --namespace roboshop --wait --timeout 15m
                fi
                ;;
            esac
          fi

          # ELK is intentionally left disabled: the node group is 2 x t3.medium,
          # which allows 17 pods per node, and the ELK stack adds five more pods.
          # Scale the node group (e.g. t3.large) before enabling it.
          if ! helm upgrade --install roboshop ../helm-roboshop \
            --namespace roboshop --create-namespace \
            --wait \
            --atomic \
            --timeout 20m \
            --set elk.enabled=false \
            --set ingress.enabled=true \
            --set ingress.host=roboshop.rk1214.in \
            --set "ingress.annotations.alb\.ingress\.kubernetes\.io/security-groups=$ALB_SG_ID"; then
            echo "Roboshop Helm deployment failed; collecting Kubernetes diagnostics."
            kubectl get storageclass || true
            kubectl get pods,pvc,jobs -n roboshop -o wide || true
            kubectl get events -n roboshop --sort-by=.lastTimestamp | tail -n 40 || true
            kubectl describe job/mysql-db-seed -n roboshop || true
            JOB_POD=$(kubectl get pods -n roboshop -l job-name=mysql-db-seed -o name | head -n 1 || true)
            if [ -n "$JOB_POD" ]; then
              kubectl describe -n roboshop "$JOB_POD" || true
              kubectl logs -n roboshop "$JOB_POD" --all-containers=true || true
            fi
            exit 1
          fi
        working-directory: infra

      - name: Configure Route53 DNS
        env:
          TF_VAR_hosted_zone_id: ${{ secrets.HOSTED_ZONE_ID }}
        run: |
          echo "Waiting for ALB 'roboshop-alb' to be provisioned..."
          sleep 15
          until aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} >/dev/null 2>&1; do
            echo "Still waiting for ALB..."
            sleep 10
          done
          aws elbv2 wait load-balancer-available --names roboshop-alb --region ${{ env.AWS_REGION }}

          export TF_VAR_alb_dns_name=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} --query 'LoadBalancers[0].DNSName' --output text)
          export TF_VAR_alb_zone_id=$(aws elbv2 describe-load-balancers --names roboshop-alb --region ${{ env.AWS_REGION }} --query 'LoadBalancers[0].CanonicalHostedZoneId' --output text)

          echo "ALB DNS : $TF_VAR_alb_dns_name"
          echo "ALB Zone: $TF_VAR_alb_zone_id"
          echo "Hosted Zone ID is set: $([ -n \"$TF_VAR_hosted_zone_id\" ] && echo YES || echo NO)"

          terraform init
          terraform apply -auto-approve
        working-directory: infra/route53